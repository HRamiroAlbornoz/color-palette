<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de Paletas · Colorfly Studio</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <header>
      <p>Colorfly Studio</p>
      <p class="header-meta">
        Generación Nº<span id="generation-counter"></span> · <time id="header-clock"></time>
      </p>
    </header>
    <main>
      <section class="controls" aria-label="Controles de generación">
        <button type="button" id="generate-button" class="generate-button">Generar paleta</button>
        <fieldset>
          <legend>Tamaño</legend>
          <label>
            <input type="radio" name="palette-size" value="6" checked />
            6
          </label>
          <label>
            <input type="radio" name="palette-size" value="8" />
            8
          </label>
          <label>
            <input type="radio" name="palette-size" value="9" />
            9
          </label>
        </fieldset>
        <fieldset>
          <legend>Formato</legend>
          <label>
            <input type="radio" name="color-format" value="hex" checked />
            HEX
          </label>
          <label>
            <input type="radio" name="color-format" value="hsl" />
            HSL
          </label>
        </fieldset>
      </section>
      <ul class="palette-grid" id="palette-grid" role="list" aria-label="Paleta generada"></ul>
      <section class="archive" aria-label="Archivo de paletas guardadas">
        <div class="archive-header">
          <h2>Archivo</h2>
          <button type="button" id="save-batch-button" class="save-button">Guardar lote</button>
        </div>
        <ul class="archive-list" id="archive-list"></ul>
      </section>
    </main>
    <footer>
      <p>
        Hernán Albornoz ·
        <a href="https://github.com/HRamiroAlbornoz/color-palette">GitHub</a>
      </p>
    </footer>
    <p id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></p>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
