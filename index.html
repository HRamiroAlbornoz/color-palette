<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de Paletas · Colorfly Studio</title>
    <script>
      try {
        const storedTheme = localStorage.getItem('colorfly-theme');
        if (storedTheme === 'light' || storedTheme === 'dark') {
          document.documentElement.dataset.theme = storedTheme;
        }
      } catch {}
    </script>
    <link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="fonts/GeistMono-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <a class="skip-link" href="#palette-grid" id="skip-link">Saltar a la paleta</a>
    <div class="app">
      <p class="brand sidebar-region">Colorfly Studio</p>
      <header class="topbar">
        <div>
          <h1 class="generation-title">Generación Nº<span id="generation-counter"></span></h1>
          <p class="topbar-meta">
            <span id="palette-summary"></span> · <time id="topbar-clock"></time>
          </p>
        </div>
        <fieldset class="segmented segmented--theme">
          <legend class="visually-hidden">Tema</legend>
          <div class="segmented-options" id="theme-options"></div>
        </fieldset>
      </header>
      <section class="controls sidebar-region" aria-label="Controles de generación">
        <button type="button" id="generate-button" class="generate-button">Generar paleta</button>
        <fieldset class="segmented" id="size-fieldset">
          <legend>Tamaño</legend>
          <div class="segmented-options" id="size-options"></div>
        </fieldset>
        <fieldset class="segmented" id="format-fieldset">
          <legend>Formato</legend>
          <div class="segmented-options" id="format-options"></div>
        </fieldset>
      </section>
      <main class="workspace">
        <ul class="palette-grid" id="palette-grid" role="list" aria-label="Paleta generada"></ul>
      </main>
      <section class="archive sidebar-region" aria-label="Archivo de paletas guardadas">
        <div class="archive-header">
          <h2>Archivo</h2>
          <button type="button" id="save-batch-button" class="save-button">Guardar lote</button>
        </div>
        <ul class="archive-list" id="archive-list"></ul>
      </section>
      <footer class="credit sidebar-region">
        <p>
          Hernán Albornoz ·
          <a href="https://github.com/HRamiroAlbornoz/color-palette">GitHub</a>
        </p>
      </footer>
    </div>
    <p id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></p>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
